      data-gpl-role="optional-detail"
      d="M 283 116 C 288 154 292 190 292 228"
      stroke-dasharray="6 7"
    />
    <line
      id="high-hip-balance-line"
      data-gpl-role="optional-detail"
      x1="105"
      y1="390"
      x2="315"
      y2="390"
      stroke-dasharray="7 8"
    />
    <line
      id="hem-turnback-guide"
      data-gpl-role="optional-detail"
      x1="72"
      y1="634"
      x2="348"
      y2="634"
      stroke-dasharray="7 8"
    />
