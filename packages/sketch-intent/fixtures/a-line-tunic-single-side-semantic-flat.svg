<svg xmlns="http://www.w3.org/2000/svg" width="430" height="720" viewBox="0 0 430 720">
  <title>Semantic A-line tunic single-side technical flat</title>
  <desc>
    Phase C fixture for a symmetric A-line tunic where the designer drew only
    the left-side construction curves plus center axis. The interpreter should
    mirror shoulder, armhole, and side-seam intent across the detected axis.
  </desc>

  <g id="front-panel" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path
      id="front-panel-silhouette"
      data-gpl-role="silhouette"
      data-gpl-view="front"
      data-gpl-garment="a-line-tunic"
      d="M 146 70 C 158 82 178 90 215 90 C 252 90 272 82 284 70 L 322 108 C 340 205 358 380 390 670 L 40 670 C 72 380 90 205 108 108 Z"
    />

    <path
      id="front-neckline"
      data-gpl-role="neckline"
      data-gpl-view="front"
      d="M 160 76 C 176 134 254 134 270 76"
    />
    <path
      id="front-left-shoulder"
      data-gpl-role="shoulder"
      data-gpl-view="front"
      d="M 108 108 L 146 70"
    />
    <path
      id="front-left-armhole"
      data-gpl-role="armhole"
      data-gpl-view="front"
      d="M 108 108 C 96 158 88 204 86 252"
    />
    <path
      id="front-left-side-seam"
      data-gpl-role="side-seam"
      data-gpl-view="front"
      d="M 86 252 C 78 374 62 522 40 670"
    />
    <line
      id="front-hem"
      data-gpl-role="hem"
      data-gpl-view="front"
      x1="40"
      y1="670"
      x2="390"
      y2="670"
    />
    <line
      id="front-center-axis"
      data-gpl-role="center-axis"
      data-gpl-view="front"
      x1="215"
      y1="98"
      x2="215"
      y2="670"
      stroke="#4f6070"
      stroke-width="2"
      stroke-dasharray="10 10"
    />
  </g>
</svg>
