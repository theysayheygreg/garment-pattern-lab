<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720">
  <title>Semantic A-line tunic with explicit figure height reference</title>
  <desc>
    Phase D fixture. The garment is the same clean front semantic flat plus an
    external figure-height reference line. The reference is intentionally
    outside the garment silhouette so Phase B treats it as annotation, not a
    pattern panel.
  </desc>

  <g id="front-panel" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path
      id="front-panel-silhouette"
      data-gpl-role="silhouette"
      data-gpl-view="front"
      data-gpl-garment="a-line-tunic"
      d="M 146 70 C 158 82 178 90 215 90 C 252 90 272 82 284 70 L 322 108 C 340 205 358 380 390 670 L 40 670 C 72 380 90 205 108 108 Z"
    />
    <path id="front-neckline" data-gpl-role="neckline" data-gpl-view="front" d="M 160 76 C 176 134 254 134 270 76" />
    <path id="front-left-shoulder" data-gpl-role="shoulder" data-gpl-view="front" d="M 108 108 L 146 70" />
    <path id="front-right-shoulder" data-gpl-role="shoulder" data-gpl-view="front" d="M 284 70 L 322 108" />
    <path id="front-left-armhole" data-gpl-role="armhole" data-gpl-view="front" d="M 108 108 C 96 158 88 204 86 252" />
    <path id="front-right-armhole" data-gpl-role="armhole" data-gpl-view="front" d="M 322 108 C 334 158 342 204 344 252" />
    <path id="front-left-side-seam" data-gpl-role="side-seam" data-gpl-view="front" d="M 86 252 C 78 374 62 522 40 670" />
    <path id="front-right-side-seam" data-gpl-role="side-seam" data-gpl-view="front" d="M 344 252 C 352 374 368 522 390 670" />
    <line id="front-hem" data-gpl-role="hem" data-gpl-view="front" x1="40" y1="670" x2="390" y2="670" />
    <line id="front-center-axis" data-gpl-role="center-axis" data-gpl-view="front" x1="215" y1="98" x2="215" y2="670" stroke="#4f6070" stroke-width="2" stroke-dasharray="10 10" />
  </g>

  <g id="scale-reference" fill="none" stroke="#376f95" stroke-width="3" stroke-linecap="round">
    <line
      id="figure-height-reference"
      data-gpl-role="figure-height-reference"
      data-gpl-assumed-height-in="66"
      x1="500"
      y1="60"
      x2="500"
      y2="660"
    />
  </g>
</svg>
